name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run lint
        run: bash scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests and write summary
        run: |
          test_count="$(python -m pytest --collect-only -q app/tests | tail -n 1 | awk '{print $1}')"
          result="success"
          python -m pytest app/tests -v || result="failure"

          {
            echo "## Test report"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | $(git log -1 --pretty=%s) |"
            echo "| Tests | $test_count |"
            echo "| Result | $result |"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$result" = "success" ]

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Check application import
        env:
          DB_PATH: /tmp/tasks-api-ci.db
        run: python -c "from app.main import app; assert app is not None"
